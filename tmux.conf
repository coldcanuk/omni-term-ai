# Enable mouse support (allows clicking and dragging the middle bar to resize)
set -g mouse on

# Vim-like pane navigation (switch panes with prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Keyboard shortcuts to resize panes (prefix + Shift + H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Customize the pane dividers (the "middle bar")
# Normal border color
set -g pane-border-style fg=colour240
# Active pane border color
set -g pane-active-border-style fg=colour39
# Make the borders stand out more (e.g. single, double, heavy, simple, number)
set -g pane-border-lines heavy

# Show each pane's title in the top border (harness names are set by
# launch-ai-workspace via select-pane -T; requires tmux >= 3.2)
set -g pane-border-status top

# Floating Scratchpad Terminal (prefix + Space)
bind Space run-shell "tmux-toggle-scratch"

# Watch row (prefix + Shift + W). Lowercase prefix + w stays choose-tree.
# The current pane becomes a 24-row band with an 80-column watch pane beside it.
bind W run-shell "omni-watch-row"

# Move the detected watch row (prefix + Alt + h/j/k/l).
bind -r M-h run-shell "omni-watch-move left"
bind -r M-j run-shell "omni-watch-move down"
bind -r M-k run-shell "omni-watch-move up"
bind -r M-l run-shell "omni-watch-move right"

# Dual-Tab Toggle
# Instantly switch between the Command Center and the Editor
bind e last-window

# Panic Button: Reset Editor Window
# Kills the existing Editor tab and spawns a fresh Neovim instance
bind E run-shell 'tmux kill-window -t :=Editor 2>/dev/null || true; tmux new-window -n Editor; tmux send-keys -t :=Editor "nvim -c \"Neotree show\"" C-m'

# Open Neovim with Neotree in the current pane (e.g. the bottom shell)
bind n send-keys 'nvim -c "Neotree show"' C-m
